pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

def commonProps = new Properties()
new File(rootProject.projectDir, "gradle.properties").withInputStream { commonProps.load(it) }
ext.GRADLE_EXTENDED_VERSION_USED = commonProps.getProperty("GRADLE_EXTENDED_VERSION_USED")

apply from: "https://raw.githubusercontent.com/the-inkwell/gradle-tools/${ext.GRADLE_EXTENDED_VERSION_USED}/extended.gradle"

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
    versionCatalogs {
        additionals {
            from(files(gradle.extended.files.catalog))
        }
    }
}

includeBuild "gradle/extended/${ext.GRADLE_EXTENDED_VERSION_USED}/kt-plugins"

includeBuild("../client-sdk-kotlin-multiplatform") {
    dependencySubstitution {
        substitute module("io.vopenia:vopenia") using project(":vopenia")
        substitute module("io.vopenia:vopenia-compose") using project(":vopenia-compose")
        substitute module("io.vopenia:vopenia-participants") using project(":vopenia-participants")
        substitute module("io.vopenia:vopenia-utils") using project(":vopenia-utils")
    }
}

rootProject.name = "sdk"
include("konfig")
include("tunnel-http")
include("kotlin-meet-sdk-api")
include("kotlin-meet-sdk-compose")
include("kotlin-meet-sdk")
include("shared")
include("sampleAndroid")

